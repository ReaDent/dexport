[project]
name = "dexport"
version = "0.2.0"
description = "Read and export your own DEXIS 9 x-rays and photos, through DEXIS's own DLLs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pillow>=10", "numpy>=1.24"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Source = "https://github.com/ReaDent/dexport"

[project.scripts]
dexport = "dexport.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dexport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
